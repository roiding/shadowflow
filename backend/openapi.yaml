openapi: 3.1.0
info:
  title: ShadowFlow API
  version: 0.3.0
  description: 行业、概念分钟榜单、盘后研究数据，以及可按截面日还原的个股行业/概念归属接口。
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      summary: 进程存活检查
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /health/ready:
    get:
      summary: 数据库就绪检查
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      summary: Prometheus 文本指标
      responses:
        "200":
          description: 指标文本
          content:
            text/plain:
              schema: { type: string }
  /api/v1/ranks/latest:
    get:
      summary: 最新完整板块榜单
      parameters:
        - $ref: "#/components/parameters/BoardType"
      responses:
        "200": { $ref: "#/components/responses/RankList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/ranks:
    get:
      summary: 指定交易日和时刻的板块榜单
      parameters:
        - $ref: "#/components/parameters/BoardType"
        - $ref: "#/components/parameters/TradeDate"
        - name: at
          in: query
          required: true
          schema: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", example: "10:30" }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/ranks/daily-close:
    get:
      summary: 指定交易日、指定类型的完整日终榜
      parameters:
        - name: type
          in: query
          required: false
          description: 行业和概念读取 15:00 日终快照；个股读取收盘后采集并归一到 15:00 的完整榜单。
          schema: { type: string, enum: [industry, concept, stock], default: stock }
        - $ref: "#/components/parameters/TradeDate"
        - name: q
          in: query
          schema: { type: string, maxLength: 50 }
        - name: sort
          in: query
          schema: { type: string, enum: [rank, name, code, dark_money, main_money_inflow, change_pct, dark_activity, open_price, high_price, low_price, close_price, previous_close, volume, turnover, turnover_rate, amplitude], default: rank }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/intraday:
    get:
      summary: 板块当日分钟序列，盘后回退到含 15:00 的 48 个五分钟资金点
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/trend:
    get:
      summary: 板块历史五分钟资金研究序列
      description: 盘后从 darktradetick 重新抓取，仅包含暗盘资金、明盘资金和主力净流入三项累计资金字段。
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: interval
          in: query
          schema: { type: string, const: 5m, default: 5m }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/stocks:
    get:
      summary: 按截面日查询板块成分股
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/RelationList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/boards/{type}/{code}/quotes:
    get:
      summary: 按截面日查询板块成分股及最新行情快照
      description: 成分关系按 as_of 还原；同日个股暗盘榜提供暗盘排名、暗盘资金、主力净流入和原始活跃度；行情由东方财富批量读取。活跃度口径为 abs(暗盘资金) / 成交额。
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/BoardQuoteList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/stocks/{code}/boards:
    get:
      summary: 按截面日查询股票所属行业和概念
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{6}$", example: "300308" }
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/RelationList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/stocks/{code}/research-5m:
    get:
      summary: 查询个股单日五分钟资金与未复权行情联合序列
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{6}$", example: "300308" }
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200":
          description: 48 个五分钟资金点及对应行情 K
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockResearchPoint" }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/relations/changes:
    get:
      summary: 查询指定交易日检测到的归属新增和删除事件
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [industry, concept] }
      responses:
        "200":
          description: 当日关系变化；首次全量基线不重复展开为 added 事件
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockBoardRelationChange" }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/export:
    get:
      summary: 导出单板块 5 分钟研究 CSV
      parameters:
        - $ref: "#/components/parameters/BoardType"
        - name: code
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: format
          in: query
          schema: { type: string, const: csv, default: csv }
      responses:
        "200":
          description: UTF-8 BOM CSV
          content:
            text/csv:
              schema: { type: string }
  /api/v1/research/daily-close/export:
    get:
      summary: 联合导出指定交易日的行业、概念、个股三类日终榜
      parameters:
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200":
          description: UTF-8 BOM CSV；snapshot_kind 固定为 daily_close，snapshot_at 统一为 15:00
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/quality:
    get:
      summary: 每日数据质量摘要
      parameters:
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200":
          description: 质量摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityEnvelope"
  /api/v1/trading-days:
    get:
      summary: 查询交易日列表
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 日期列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string, format: date }
                  meta: { type: object }
  /api/v1/collection-runs:
    get:
      summary: 采集运行记录
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: 运行记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionRun" }
                  meta: { type: object }
  /api/v1/focus/scan:
    post:
      summary: 按动态条件筛选连续完整日终截面
      description: 每个所选交易日都必须符合规则；资金字段单位为元，百分比行情字段使用原始小数，control_coefficient 使用百分数。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusScanRequest" }
      responses:
        "200":
          description: 筛选结果；完整交易日不足时 ready=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusResult" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/focus/three-day:
    get:
      summary: 使用内置三日策略模板筛选
      parameters:
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: 与动态接口相同的筛选结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusResult" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/system/status:
    get:
      summary: 系统和市场状态
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SystemStatus"
components:
  parameters:
    BoardType:
      name: type
      in: query
      required: true
      schema: { type: string, enum: [industry, concept] }
    BoardTypePath:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [industry, concept] }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, example: BK0727 }
    TradeDate:
      name: trade_date
      in: query
      required: true
      schema: { type: string, format: date }
    AsOf:
      name: as_of
      in: query
      required: false
      description: 截面日期；省略时使用服务当前的 Asia/Shanghai 日期
      schema: { type: string, format: date }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, description: YYYY-MM-DD 或 RFC3339 }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, description: YYYY-MM-DD 或 RFC3339 }
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema: { type: object }
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RankList:
      description: 榜单或序列
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/RankRecord" }
              meta: { type: object }
    RelationList:
      description: 按“最近基线 + 截面日前累计变更”还原的关系列表
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/StockBoardRelation" }
              meta: { type: object }
    BoardQuoteList:
      description: 成分关系与最新行情快照；行情不可用时仍返回成分关系
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/BoardStockQuote" }
              meta: { type: object }
  schemas:
    FocusCondition:
      type: object
      required: [field, operator, value]
      properties:
        field:
          type: string
          enum: [turnover, turnover_rate, change_pct, control_coefficient, dark_money, regular_money, main_money_inflow, dark_activity, dark_inflow_ratio, rank, close_price, amplitude, volume, up_count, flat_count, down_count]
        operator: { type: string, enum: [gt, gte, lt, lte, eq, between] }
        value: { type: number }
        max_value: { type: number, description: operator=between 时必填且不得小于 value }
    FocusScanRequest:
      type: object
      required: [as_of, consecutive_days, concept_match, concept_conditions, stock_match, stock_conditions, stock_scope]
      properties:
        as_of: { type: string, format: date }
        consecutive_days: { type: integer, minimum: 1, maximum: 60 }
        concept_match: { type: string, enum: [all, any] }
        concept_conditions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FocusCondition" }
        stock_match: { type: string, enum: [all, any] }
        stock_conditions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FocusCondition" }
        stock_scope:
          type: object
          required: [main_board_only, exclude_st, require_qualified_concepts]
          properties:
            main_board_only: { type: boolean }
            exclude_st: { type: boolean }
            require_qualified_concepts: { type: boolean }
    FocusResult:
      type: object
      properties:
        requested_as_of: { type: string, format: date }
        as_of: { type: string, format: date }
        ready: { type: boolean }
        trade_dates: { type: array, items: { type: string, format: date } }
        required_days: { type: integer }
        request: { $ref: "#/components/schemas/FocusScanRequest" }
        concepts: { type: array, items: { type: object } }
        stocks: { type: array, items: { type: object } }
        stats: { type: object }
    RankRecord:
      type: object
      required: [trade_date, snapshot_at, rank_type, rank, code, name, dark_money, regular_money, main_money_inflow]
      properties:
        trade_date: { type: string, format: date }
        snapshot_at: { type: string, format: date-time }
        rank_type: { type: string, enum: [stock, industry, concept] }
        rank: { type: integer, format: int64 }
        market: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        quote_time: { type: string }
        latest_price_raw: { type: integer, format: int64 }
        open_price: { type: number }
        high_price: { type: number }
        low_price: { type: number }
        close_price: { type: number }
        previous_close: { type: number, description: 前收盘价，用于涨跌停判断和复权日识别 }
        change_value: { type: number }
        change_pct: { type: number, description: 原始小数，展示时乘 100 }
        volume: { type: integer, format: int64 }
        turnover: { type: integer, format: int64, description: 成交额，单位元 }
        turnover_rate: { type: number, description: 原始小数，展示时乘 100 }
        amplitude: { type: number, description: 原始小数，展示时乘 100 }
        quote_available: { type: boolean }
        dark_money: { type: integer, format: int64 }
        regular_money: { type: integer, format: int64 }
        main_money_inflow: { type: integer, format: int64 }
        dark_activity: { type: number, description: 原始小数，展示时乘 100 }
        dark_inflow_ratio: { type: number, description: 原始小数，展示时乘 100 }
        up_count: { type: integer, format: int64 }
        flat_count: { type: integer, format: int64 }
        down_count: { type: integer, format: int64 }
        leader_name: { type: string }
        leader_code: { type: string }
        fetched_at: { type: string, format: date-time }
    StockBoardRelation:
      type: object
      required: [stock_code, stock_name, board_code, board_name, board_type, relation_source, relation_scope, effective_date]
      properties:
        stock_code: { type: string, pattern: "^[0-9]{6}$" }
        stock_market: { type: integer, format: int64 }
        stock_name: { type: string }
        board_code: { type: string }
        board_name: { type: string }
        board_type: { type: string, enum: [industry, concept] }
        source_order: { type: integer }
        relation_source: { type: string, const: quote_clist }
        relation_scope: { type: string, const: all_industry_concept }
        effective_date: { type: string, format: date }
        detected_at: { type: string, format: date-time }
        raw_data: { type: string, description: 上游成分股原始行 JSON }
    StockBoardRelationChange:
      allOf:
        - $ref: "#/components/schemas/StockBoardRelation"
        - type: object
          required: [change_type, run_id]
          properties:
            change_type: { type: string, enum: [added, removed] }
            run_id: { type: string }
    BoardStockQuote:
      allOf:
        - $ref: "#/components/schemas/StockBoardRelation"
        - type: object
          properties:
            latest_price: { type: number }
            open_price: { type: number }
            high_price: { type: number }
            low_price: { type: number }
            previous_close: { type: number }
            change_pct: { type: number, description: 原始小数，展示时乘 100 }
            change_value: { type: number }
            volume: { type: integer, format: int64 }
            turnover: { type: integer, format: int64 }
            turnover_rate: { type: number, description: 原始小数，展示时乘 100 }
            amplitude: { type: number, description: 原始小数，展示时乘 100 }
            quote_time: { type: string }
            fetched_at: { type: string, format: date-time }
            quote_available: { type: boolean }
            dark_rank: { type: integer, format: int64, description: 同日个股暗盘榜排名 }
            dark_money: { type: integer, format: int64 }
            main_money_inflow: { type: integer, format: int64 }
            dark_activity: { type: number, description: 个股暗盘榜原始活跃度，口径为 abs(暗盘资金) / 成交额 }
            dark_data_available: { type: boolean }
    CollectionRun:
      type: object
      properties:
        run_id: { type: string }
        snapshot_at: { type: string, format: date-time }
        snapshot_kind: { type: string, enum: [minute_work, research_5m, daily_close, stock_kline_5m] }
        rank_type: { type: string, enum: [stock, industry, concept] }
        status: { type: string, enum: [running, success, partial, failed, skipped] }
        requested_date: { type: string, format: date }
        actual_trade_date: { type: string }
        expected_total: { type: integer }
        fetched_total: { type: integer }
        page_count: { type: integer }
        attempt_count: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        error_code: { type: string }
        error_message: { type: string }
    SystemStatus:
      type: object
      properties:
        server_time: { type: string, format: date-time }
        timezone: { type: string, const: Asia/Shanghai }
        market_status: { type: string, enum: [pre_open, open, lunch_break, closed] }
        trading_day: { type: boolean }
        latest_trading_day: { type: string, format: date }
        uptime_seconds: { type: integer, format: int64 }
    StockResearchPoint:
      type: object
      properties:
        trade_date: { type: string, format: date }
        snapshot_at: { type: string, format: date-time }
        market: { type: integer, format: int64 }
        code: { type: string }
        money_rank: { type: integer, format: int64 }
        dark_money: { type: integer, format: int64 }
        regular_money: { type: integer, format: int64 }
        main_money_inflow: { type: integer, format: int64 }
        open_price: { type: number }
        high_price: { type: number }
        low_price: { type: number }
        close_price: { type: number }
        volume: { type: integer, format: int64 }
        turnover: { type: integer, format: int64 }
        amplitude: { type: number }
        change_pct: { type: number }
        change_value: { type: number }
        turnover_rate: { type: number }
        kline_available: { type: boolean }
    QualityEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              trade_date: { type: string, format: date }
              rank_type: { type: string, enum: [industry, concept] }
              expected_minutes: { type: integer }
              collected_minutes: { type: integer }
              expected_research_snapshots: { type: integer }
              collected_research_snapshots: { type: integer }
              expected_daily_close_snapshots: { type: integer }
              collected_daily_close_snapshots: { type: integer }
              missing_minutes: { type: array, items: { type: string } }
              missing_research_snapshots: { type: array, items: { type: string } }
              missing_daily_close_snapshots: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            trade_date: { type: string, format: date }
            stock_archive:
              type: object
              properties:
                trade_date: { type: string, format: date }
                expected_stocks: { type: integer }
                expected_points: { type: integer, const: 48 }
                expected_kline_stocks: { type: integer }
                money_rows: { type: integer }
                kline_rows: { type: integer }
                daily_close_rows: { type: integer }
                daily_kline_rows: { type: integer }
                money_archived_at: { type: string, format: date-time }
                kline_archived_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
