openapi: 3.1.0
info:
  title: ShadowFlow API
  version: 0.6.0
  description: 行业、概念分钟榜单、盘后研究归档、个股行业/概念归属，以及独立的涨停事件共现和股性研究接口。
servers:
  - url: http://127.0.0.1:8080
security:
  - BearerAuth: []
paths:
  /health/live:
    get:
      summary: 进程存活检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /health/ready:
    get:
      summary: 数据库就绪检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      summary: Prometheus 文本指标
      responses:
        "200":
          description: 指标文本
          content:
            text/plain:
              schema: { type: string }
  /api/v1/ranks/latest:
    get:
      summary: 最新完整板块榜单
      description: meta.previous_trade_date 根据当前返回快照的交易日及交易日历确定。即使该日未归档也不回退到更早日期；休市或数据滞后时以实际展示日为基准。
      parameters:
        - $ref: "#/components/parameters/BoardType"
      responses:
        "200": { $ref: "#/components/responses/LatestRankList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/ranks:
    get:
      summary: 指定交易日和时刻的板块榜单
      parameters:
        - $ref: "#/components/parameters/BoardType"
        - $ref: "#/components/parameters/TradeDate"
        - name: at
          in: query
          required: true
          schema: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", example: "10:30" }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/ranks/daily-close:
    get:
      summary: 指定交易日、指定类型的完整日终榜
      parameters:
        - name: type
          in: query
          required: false
          description: 行业和概念读取 15:00 日终快照；个股读取收盘后采集并归一到 15:00 的完整榜单。
          schema: { type: string, enum: [industry, concept, stock], default: stock }
        - $ref: "#/components/parameters/TradeDate"
        - name: revision_id
          in: query
          description: 不填时读取该交易日归档；revision_id 仅为兼容标识。
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 50 }
        - name: sort
          in: query
          schema: { type: string, enum: [rank, name, code, dark_money, main_money_inflow, change_pct, dark_activity, open_price, high_price, low_price, close_price, previous_close, volume, turnover, turnover_rate, amplitude], default: rank }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/intraday:
    get:
      summary: 板块当日分钟序列，盘后回退到含 15:00 的 48 个五分钟资金点
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/trend:
    get:
      summary: 板块历史五分钟资金研究序列
      description: 盘后从 darktradetick 重新抓取，仅包含暗盘资金、明盘资金和主力净流入三项累计资金字段。
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: revision_id
          in: query
          description: 指定后按该归档标识对应的交易日返回完整 48 点。
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, const: 5m, default: 5m }
      responses:
        "200": { $ref: "#/components/responses/RankList" }
  /api/v1/boards/{type}/{code}/stocks:
    get:
      summary: 按截面日查询板块成分股
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/RelationList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/boards/{type}/{code}/quotes:
    get:
      summary: 按截面日查询板块成分股及最新行情快照
      description: 成分关系按 as_of 还原；行情来自后台缓存快照，HTTP 请求不会同步等待东方财富。quote_refreshing=true 表示后台正在查询最新行情，客户端应短轮询获取结果，完成或失败后停止。暗盘数据只关联同日已采集资金的收盘记录；仅有行情的记录不会标记暗盘可用。活跃度口径为 abs(暗盘资金) / 成交额。
      parameters:
        - $ref: "#/components/parameters/BoardTypePath"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/BoardQuoteList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/stocks/{code}/boards:
    get:
      summary: 按截面日查询股票所属行业和概念
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{6}$", example: "300308" }
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200": { $ref: "#/components/responses/RelationList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/stocks/{code}/research-5m:
    get:
      summary: 查询个股单日五分钟资金与未复权行情联合序列
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{6}$", example: "300308" }
        - $ref: "#/components/parameters/TradeDate"
        - name: revision_id
          in: query
          description: 不填时读取当前个股五分钟联合数据。
          schema: { type: string }
      responses:
        "200":
          description: 48 个五分钟资金点及对应行情 K
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockResearchPoint" }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/relations/changes:
    get:
      summary: 查询指定交易日检测到的归属新增和删除事件
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [industry, concept] }
      responses:
        "200":
          description: 当日关系变化；首次全量基线不重复展开为 added 事件
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockBoardRelationChange" }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/export:
    get:
      summary: 导出单板块 5 分钟研究 CSV
      parameters:
        - $ref: "#/components/parameters/BoardType"
        - name: code
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: format
          in: query
          schema: { type: string, const: csv, default: csv }
      responses:
        "200":
          description: UTF-8 BOM CSV
          content:
            text/csv:
              schema: { type: string }
  /api/v1/research/daily-close/export:
    get:
      summary: 联合导出指定交易日的行业、概念、个股三类日终榜
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: revision_id
          in: query
          description: 不填时导出该交易日归档。
          schema: { type: string }
      responses:
        "200":
          description: UTF-8 BOM CSV；snapshot_kind 固定为 daily_close，snapshot_at 统一为 15:00
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/quality:
    get:
      summary: 每日数据质量摘要
      parameters:
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200":
          description: 质量摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityEnvelope"
  /api/v1/research/revisions:
    get:
      summary: 查询指定交易日的归档完整性摘要
      parameters:
        - $ref: "#/components/parameters/TradeDate"
      responses:
        "200":
          description: 归档标识、内容摘要和当前指针；同一交易日通常只有一条记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ArchiveRevision" } }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/features:
    get:
      summary: 查询指定交易日的日级分析特征
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: revision_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [industry, concept, stock] }
      responses:
        "200":
          description: 交易日日级特征和特征集元数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DailyFeature" } }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/research/labels:
    get:
      summary: 查询指定交易日可用的未来收益标签
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: revision_id
          in: query
          schema: { type: string }
        - name: target_revision_id
          in: query
          description: 兼容旧调用；目标数据按交易日主归档读取。
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [industry, concept, stock] }
        - name: horizon
          in: query
          schema: { type: integer, enum: [1, 3, 5, 10, 20] }
      responses:
        "200":
          description: 未来收益、相对行业收益、最大有利/不利波动标签
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FutureReturnLabel" } }
                  meta: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/trading-days:
    get:
      summary: 查询交易日列表
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: 日期列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string, format: date }
                  meta: { type: object }
  /api/v1/collection-runs:
    get:
      summary: 采集运行记录
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: 运行记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CollectionRun" }
                  meta: { type: object }
  /api/v1/focus/scan:
    post:
      summary: 按动态条件筛选连续完整日终截面
      description: 每个所选交易日都必须符合规则；资金字段单位为元，百分比行情字段使用原始小数，control_coefficient 使用百分数。两种筛选接口共用一个并发槽，已有扫描运行时返回 503 和 Retry-After。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusScanRequest" }
      responses:
        "200":
          description: 筛选结果；完整交易日不足时 ready=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusResult" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/focus/three-day:
    get:
      summary: 使用内置三日策略模板筛选
      parameters:
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: 与动态接口相同的筛选结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FocusResult" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/limit-up/quality:
    get:
      summary: 涨跌停事件归档的独立质量状态
      description: 区分未启用、未采集、运行中、失败和完整零事件日；重采失败时保留已发布的完整版本，并单列最近运行结果。
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - $ref: "#/components/parameters/LimitUpScope"
      responses:
        "200":
          description: 当前日期的事件归档状态
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LimitUpArchiveQuality" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/limit-up/focus:
    get:
      summary: 已归档的同花顺题材与连板补充资料
      description: 只读取本地补充归档。题材为源Top列表，市场概览及晋级对比使用源默认口径；部分接口无日期回显，响应保留该限制。
      parameters:
        - $ref: "#/components/parameters/TradeDate"
        - $ref: "#/components/parameters/LimitUpScope"
      responses:
        "200":
          description: 所选日期补充归档，未采集时snapshot为空。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ThsFocusArchive" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/limit-up/overview:
    get:
      summary: 完整涨跌停事件日和候选股票
      description: 只读本地同花顺事件库；自然日回看范围内仅涨停、炸板、跌停三池完整日参与统计，空库返回空数组。打开页面不会采集上游数据。
      parameters:
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/LimitUpDays"
        - $ref: "#/components/parameters/LimitUpScope"
      responses:
        "200":
          description: 样本覆盖、每日三池总数和窗口内出现过的股票
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LimitUpOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/limit-up/stocks/{code}:
    get:
      summary: 个股涨跌停共现网络和股性
      description: 不按板块过滤，以完整采集日为共同分母。默认排序依据为热度折算共现，再按共同次数、代码；order=overlap 时先按共同次数降序。缺档不补零，常量序列的 phi 为 null。该结果是描述统计，不代表因果、收益相关或统计显著性。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{6}$' }
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/LimitUpDays"
        - $ref: "#/components/parameters/LimitUpScope"
        - name: event
          in: query
          schema: { type: string, enum: [seal, touch, down], default: seal }
          description: seal 为同日收盘涨停，touch 为同日曾触涨停（涨停池与炸板池并集），down 为同日收盘跌停。
        - name: min_overlap
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: order
          in: query
          schema: { type: string, enum: [heat, overlap], default: heat }
          description: heat 为热度折算共现排序；overlap 为原始共同事件次数降序，适合快速识别协同次数最高的股票。
      responses:
        "200":
          description: 个股画像、共同事件日期、邻居与中心股票事件记录
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LimitUpAnalysis" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/limit-up/today-network:
    get:
      summary: 今日封板股票的联动核心
      description: 实时读取当前仍封住涨停的股票，在这些成员之间建立历史收盘封板共现子图，先把与今日成员历史高频共现、或命中今日Top20历史题材主线的未封板股票列为候选，再只为最终候选批量读取盘中行情。历史严格截止到今日之前最近一个完整归档日，今日快照与候选行情不写入历史，也不参与历史分母。结果依赖点击时的盘中快照，开板会使成员变化；共现为描述统计，不代表因果、带动或未来收益。
      parameters:
        - $ref: "#/components/parameters/LimitUpDays"
        - $ref: "#/components/parameters/LimitUpScope"
        - name: min_overlap
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 1 }
          description: 历史收盘封板的最少共同天数。
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
          description: 返回的核心股数量；无有效关系或并列时按核心度、关系数、封板天数及代码稳定排序。
        - name: candidates
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: 每条实时主线独立返回的非封板外溢待选股数量上限。
      responses:
        "200":
          description: 当前封板成员、历史关系子图及核心排名
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LimitUpTodayNetwork" }
                  meta:
                    type: object
                    required: [snapshot_only, history_excludes_today, snapshot_fetched_at, live_candidates, live_quote_status]
                    properties:
                      snapshot_only: { type: boolean, const: true }
                      history_excludes_today: { type: boolean, const: true }
                      snapshot_fetched_at: { type: string, format: date-time }
                      live_candidates: { type: boolean, description: 是否已把盘中行情应用到候选列表。 }
                      live_quote_status: { type: string, enum: [disabled, empty, unavailable, partial, ready], description: 候选行情读取状态。 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/system/status:
    get:
      summary: 系统和市场状态
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SystemStatus"
components:
  parameters:
    LimitUpDays:
      name: days
      in: query
      schema: { type: integer, minimum: 1, maximum: 366, default: 90 }
      description: 含截止日在内的自然日回看长度；未采集日不纳入分母。
    LimitUpScope:
      name: scope
      in: query
      schema: { type: string, enum: ["HS,GEM2STAR", "HS,GEM2STAR,ST,NEW"], default: "HS,GEM2STAR" }
      description: 市场范围独立存储，不混合不同筛选口径；不保证北交所覆盖。
    BoardType:
      name: type
      in: query
      required: true
      schema: { type: string, enum: [industry, concept] }
    BoardTypePath:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [industry, concept] }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, example: BK0727 }
    TradeDate:
      name: trade_date
      in: query
      required: true
      schema: { type: string, format: date }
    AsOf:
      name: as_of
      in: query
      required: false
      description: 截面日期；省略时使用服务当前的 Asia/Shanghai 日期
      schema: { type: string, format: date }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, description: YYYY-MM-DD 或 RFC3339 }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, description: YYYY-MM-DD 或 RFC3339 }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema: { type: object }
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LatestRankList:
      description: 最新完整板块榜单及比较交易日
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/RankRecord" }
              meta: { $ref: "#/components/schemas/LatestRankMeta" }
    RankList:
      description: 榜单或序列
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/RankRecord" }
              meta: { type: object }
    RelationList:
      description: 按“最近基线 + 截面日前累计变更”还原的关系列表
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/StockBoardRelation" }
              meta: { type: object }
    BoardQuoteList:
      description: 成分关系与最新行情快照；行情不可用时仍返回成分关系
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/BoardStockQuote" }
              meta:
                $ref: "#/components/schemas/BoardQuoteMeta"
  schemas:
    ThsFocusArchive:
      type: object
      required: [trade_date, scope, status, snapshot]
      properties:
        trade_date: { type: string, format: date }
        scope: { type: string, enum: ["HS,GEM2STAR", "HS,GEM2STAR,ST,NEW"] }
        status: { type: string, enum: [not_collected, complete] }
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/ThsFocusSnapshot"
            - type: "null"
    ThsFocusSnapshot:
      type: object
      required: [trade_date, source, scope, market_scope, fetched_at, source_date_verified, limitations, blocks, ladder, market, comparison]
      properties:
        trade_date: { type: string, format: date }
        source: { type: string, const: ths_focus }
        scope: { type: string, enum: ["HS,GEM2STAR", "HS,GEM2STAR,ST,NEW"] }
        market_scope: { type: string, const: source_default }
        fetched_at: { type: string, format: date-time }
        source_date_verified: { type: boolean, description: 当前源有不回显日期的子接口，此值固定为false。 }
        limitations: { type: array, items: { type: string } }
        blocks:
          type: array
          items:
            type: object
            required: [code, name, change, limit_up_count, stocks]
            properties:
              code: { type: string }
              name: { type: string }
              change: { type: [number, "null"] }
              limit_up_count: { type: integer }
              stocks: { type: array, items: { $ref: "#/components/schemas/ThsFocusStock" } }
        ladder:
          type: array
          items:
            type: object
            required: [height, stocks]
            properties:
              height: { type: integer }
              stocks: { type: array, items: { $ref: "#/components/schemas/ThsFocusStock" } }
        market: { type: object, additionalProperties: true, description: 源市场概览，数字字符串及中文单位原样保留。 }
        comparison: { type: object, additionalProperties: true, description: 源前后两日晋级对照，rate为涨跌幅而非概率。 }
    ThsFocusStock:
      type: object
      required: [code, name, market_id, continue_num, reason, reason_detail, high_days, change_percent]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        name: { type: string }
        market_id: { type: integer }
        continue_num: { type: integer, description: 原始连板字段，独立于梯队高度和几天几板标签。 }
        reason: { type: string }
        reason_detail: { type: string, description: 同花顺源叙事，可能含AI生成内容，非本地事实核验结论。 }
        high_days: { type: string }
        change_percent: { type: [number, "null"] }
    LimitUpArchiveRun:
      type: object
      required: [run_id, status, started_at, finished_at, fetched_total, page_count, error_code, error_message]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [running, success, partial, failed, skipped] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        fetched_total: { type: integer }
        page_count: { type: integer }
        error_code: { type: string }
        error_message: { type: string }
    LimitUpArchiveQuality:
      type: object
      required: [trade_date, source, scope, status, scheduled, complete, day, last_run, latest_trade_date]
      properties:
        trade_date: { type: string, format: date }
        source: { type: string, const: ths_limit_up }
        scope: { type: string }
        status: { type: string, enum: [disabled, not_collected, running, failed, complete] }
        scheduled: { type: boolean, description: 此范围的自动盘后事件归档是否已启用。 }
        complete: { type: boolean }
        day:
          oneOf:
            - $ref: "#/components/schemas/LimitUpDay"
            - type: "null"
        last_run:
          oneOf:
            - $ref: "#/components/schemas/LimitUpArchiveRun"
            - type: "null"
        latest_trade_date: { type: string, description: 该范围不晚于所选日期的最近完整事件日期，无数据时为空。 }
    LimitUpCoverage:
      type: object
      required: [source, scope, from_date, as_of, lookback_days, observed_days, first_date, latest_date, sample_sufficient, minimum_samples]
      properties:
        source: { type: string, const: ths_limit_up }
        scope: { type: string, enum: ["HS,GEM2STAR", "HS,GEM2STAR,ST,NEW"] }
        from_date: { type: string, format: date }
        as_of: { type: string, format: date }
        lookback_days: { type: integer }
        observed_days: { type: integer, description: 完整采集的交易日数量，包含经确认的空榜单日。 }
        first_date: { type: string, description: 最早样本日期，空库为空字符串。 }
        latest_date: { type: string, description: 最近样本日期，空库为空字符串。 }
        sample_sufficient: { type: boolean, description: 仅表示样本日不少于20，非显著性检验。 }
        minimum_samples: { type: integer, const: 20 }
    LimitUpDay:
      type: object
      required: [trade_date, fetched_at, sealed_count, broken_count, down_count, touched_count, content_hash]
      properties:
        trade_date: { type: string, format: date }
        fetched_at: { type: string, format: date-time }
        sealed_count: { type: integer }
        broken_count: { type: integer }
        down_count: { type: integer, description: 收盘跌停数，不代表盘中所有触及跌停的股票数。 }
        touched_count: { type: integer }
        count_correction: { $ref: "#/components/schemas/LimitUpCountCorrection" }
        content_hash: { type: string, description: 规范化事件内容的 SHA-256。 }
    LimitUpCountCorrection:
      type: object
      required: [reason, source_broken_count, source_touched_count, codes]
      properties:
        reason: { type: string, const: broken_down_summary_undercount }
        source_broken_count: { type: integer, description: 未修改的源炸板汇总；本地broken_count依据已验证的完整事件重算。 }
        source_touched_count: { type: integer, description: 未修改的源触涨停汇总；本地touched_count依据已验证的完整事件重算。 }
        codes:
          type: array
          items: { type: string, pattern: '^[0-9]{6}$' }
    LimitUpStock:
      type: object
      required: [code, name, market_type, touch_days, seal_days, broken_days, down_days, last_seen]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        name: { type: string }
        market_type: { type: string }
        touch_days: { type: integer }
        seal_days: { type: integer }
        broken_days: { type: integer }
        down_days: { type: integer }
        last_seen: { type: string, format: date }
    LimitUpOverview:
      type: object
      required: [coverage, days, stocks]
      properties:
        coverage: { $ref: "#/components/schemas/LimitUpCoverage" }
        days:
          type: array
          items: { $ref: "#/components/schemas/LimitUpDay" }
        stocks:
          type: array
          items: { $ref: "#/components/schemas/LimitUpStock" }
    LimitUpCategory:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    LimitUpProfile:
      allOf:
        - $ref: "#/components/schemas/LimitUpStock"
        - type: object
          required: [seal_rate, broken_rate, event_frequency, down_frequency, up_to_down_days, open_count_known_days, open_count_unknown_days, opened_days, recovered_days, recovery_rate, mean_open_count, median_first_time, first_time_samples, limit_types, first_time_buckets]
          properties:
            seal_rate: { type: [number, "null"], description: 收盘涨停日/触板日，本地重算。 }
            broken_rate: { type: [number, "null"], description: 炸板池日/触板日。 }
            event_frequency: { type: [number, "null"], description: 触板日/完整样本日，不是经过上市及停牌校正的概率。 }
            down_frequency: { type: [number, "null"], description: 收盘跌停日/完整样本日。 }
            up_to_down_days: { type: integer, description: 同时在炸板池及跌停池的交易日数，曾触涨停后最终跌停。 }
            open_count_known_days: { type: integer }
            open_count_unknown_days: { type: integer }
            opened_days: { type: integer, description: 炸板池日加上收盘涨停且明确正开板次数的日数。 }
            recovered_days: { type: integer }
            recovery_rate: { type: [number, "null"], description: 回封日/已知曾开板日。 }
            mean_open_count: { type: [number, "null"], description: 仅在开板次数非空的记录中求平均。 }
            median_first_time: { type: string, description: 首次触板上海时间中位数，缺失时为空字符串。 }
            first_time_samples: { type: integer }
            median_first_down_time: { type: string, description: 有真实跌停时间记录的首次跌停上海时刻中位数，不使用涨停时间替代。 }
            first_down_time_samples: { type: integer }
            limit_types:
              type: array
              items: { $ref: "#/components/schemas/LimitUpCategory" }
            first_time_buckets:
              type: array
              items: { $ref: "#/components/schemas/LimitUpCategory" }
    LimitUpEvent:
      type: object
      required: [trade_date, code, name, market_id, market_type, pool, open_count, first_limit_at, last_limit_at, limit_type, high_days, reason, source_seal_rate, change_percent, turnover_rate]
      properties:
        trade_date: { type: string, format: date }
        code: { type: string, pattern: '^[0-9]{6}$' }
        name: { type: string }
        market_id: { type: integer, description: 同花顺源市场ID，不是东财市场ID。 }
        market_type: { type: string }
        pool: { type: string, enum: [limit_up, open_limit, limit_down] }
        open_count: { type: [integer, "null"], description: 未知保持null，不补0。 }
        first_limit_at: { type: [string, "null"], format: date-time }
        last_limit_at: { type: [string, "null"], format: date-time }
        first_down_at: { type: string, format: date-time, description: 源字段first_limit_down_time，缺失不推算。 }
        last_down_at: { type: string, format: date-time, description: 源字段last_limit_down_time，缺失不推算。 }
        limit_type: { type: string }
        high_days: { type: string, description: 原始几天几板标签，不直接换算成连板数。 }
        reason: { type: string }
        source_seal_rate: { type: [number, "null"], description: 源端近一年封板率，仅保留核对，不参与本地指标。 }
        change_percent: { type: [number, "null"], description: 源端百分数数值，10代表10%。 }
        turnover_rate: { type: [number, "null"], description: 源端百分数数值，10代表10%。 }
    LimitUpLink:
      type: object
      required: [code, name, market_type, anchor_days, peer_days, overlap_days, jaccard, conditional_probability, reverse_probability, baseline_probability, lift, phi, heat_adjusted_overlap, shared_dates, sample_sufficient]
      properties:
        code: { type: string }
        name: { type: string }
        market_type: { type: string }
        anchor_days: { type: integer }
        peer_days: { type: integer }
        overlap_days: { type: integer }
        jaccard: { type: number }
        conditional_probability: { type: number, description: P(邻居同日事件|中心股票事件)。 }
        reverse_probability: { type: number, description: P(中心同日事件|邻居事件)。 }
        baseline_probability: { type: number, description: 邻居事件日数/完整样本日数。 }
        lift: { type: number, description: 条件共现率除以样本基准频率。 }
        phi: { type: [number, "null"], description: 二元事件phi系数，常量序列无定义。 }
        heat_adjusted_overlap: { type: number, description: 共同日累加1/max(1,当天同范围事件池规模减1)。 }
        shared_dates:
          type: array
          items: { type: string, format: date }
        sample_sufficient: { type: boolean, description: 至少20个完整日且共同事件至少3次，不代表显著或稳定。 }
    LimitUpAnalysis:
      type: object
      required: [coverage, event, min_overlap, total_links, profile, links, events]
      properties:
        coverage: { $ref: "#/components/schemas/LimitUpCoverage" }
        event: { type: string, enum: [seal, touch, down] }
        min_overlap: { type: integer }
        total_links: { type: integer, description: 截断前符合最低共现次数的邻居数。 }
        profile: { $ref: "#/components/schemas/LimitUpProfile" }
        links:
          type: array
          items: { $ref: "#/components/schemas/LimitUpLink" }
        events:
          type: array
          items: { $ref: "#/components/schemas/LimitUpEvent" }
        theme:
          $ref: "#/components/schemas/LimitUpThemeAnalysis"
    LimitUpTodayMember:
      type: object
      required: [code, name, market_type, first_limit_at, last_limit_at, open_count, limit_type, high_days, reason, change_percent, turnover_rate, seal_days, touch_days, broken_days, down_days, core_score, coverage, strength, effective_links, strongest_peer_code, strongest_peer_name, strongest_overlap_days, theme_tags, theme_neighbor_count, theme_strength]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        name: { type: string }
        market_type: { type: string }
        first_limit_at: { type: [string, "null"], format: date-time }
        last_limit_at: { type: [string, "null"], format: date-time }
        open_count: { type: [integer, "null"], description: 盘中快照的已知开板次数，未知保持null。 }
        limit_type: { type: string }
        high_days: { type: string }
        reason: { type: string }
        change_percent: { type: [number, "null"], description: 快照时刻涨跌幅，10代表10%。 }
        turnover_rate: { type: [number, "null"], description: 快照时刻换手率，10代表10%。 }
        seal_days: { type: integer, description: 历史完整归档日中的收盘封板天数，不含今天。 }
        touch_days: { type: integer, description: 历史完整归档日中的触板天数（封板与炸板并集），不含今天。 }
        broken_days: { type: integer, description: 历史炸板池天数，不含今天。 }
        down_days: { type: integer, description: 历史收盘跌停天数，不含今天。 }
        core_score: { type: number, description: 0到100的可复现综合分：35%关系强度+25%关系覆盖+20%邻居强度+20%同题材聚类；无题材标签时题材项为0、其余三项重新归一化，仅用于今日成员内部排序。 }
        coverage: { type: number, description: 有效关系数/今日封板成员数减一。 }
        strength: { type: number, description: 与该成员相连的所有历史收盘封板边的热度折算共现之和。 }
        effective_links: { type: integer, description: 达到min_overlap的今日成员关系数。 }
        strongest_peer_code: { type: string, description: 按热度折算共现、共同次数、代码排序后的首位关联股；无关系为空字符串。 }
        strongest_peer_name: { type: string }
        strongest_overlap_days: { type: integer }
        theme_tags:
          type: array
          description: 该股在回看窗口内积累的同花顺 Top20 题材标签，最多返回前 8 个；不是完整行业/概念成份。
          items: { $ref: "#/components/schemas/LimitUpThemeTag" }
        theme_neighbor_count: { type: integer, description: 与今日其他封板成员共享至少一个有效同花顺题材标签的成员数。 }
        theme_strength: { type: number, description: 与今日其他封板成员共享题材的 IDF 加权强度和；独立于同日收盘封板共现。 }
    LimitUpTodayCore:
      type: object
      required: [member, links]
      properties:
        member: { $ref: "#/components/schemas/LimitUpTodayMember" }
        links:
          type: array
          items: { $ref: "#/components/schemas/LimitUpLink" }
    LimitUpTodayNetwork:
      type: object
      required: [trade_date, snapshot_at, trade_status, trade_status_name, sealed_count, broken_count, down_count, history_as_of, lookback_days, scope, min_overlap, coverage, history_available, members, cores, candidates, candidate_limit, mainline_themes, theme_mainline, mainline_candidates, mainline_intersections, live_candidate, live_unavailable]
      properties:
        trade_date: { type: string, format: date }
        snapshot_at: { type: string, format: date-time, description: 实时封板快照的读取时刻；盘中成员和计数可能随后变化。 }
        trade_status: { type: string, description: 上游交易状态ID，例如open、closed。 }
        trade_status_name: { type: string }
        sealed_count: { type: integer, description: 快照时仍封住涨停的成员数。 }
        broken_count: { type: integer, description: 快照时仍处于炸板池的股票数；仅用于主线质量扣减，不进入封板成员。 }
        down_count: { type: integer, description: 快照时处于跌停池的股票数；仅用于主线质量扣减，不进入封板成员。 }
        history_as_of: { type: string, description: 历史关系使用的最近完整归档日；无历史为空字符串。始终早于trade_date。 }
        lookback_days: { type: integer, description: 历史窗口的自然日长度，以history_as_of为截止日。 }
        scope: { type: string, enum: ["HS,GEM2STAR", "HS,GEM2STAR,ST,NEW"] }
        min_overlap: { type: integer }
        coverage: { $ref: "#/components/schemas/LimitUpCoverage" }
        history_available: { type: boolean }
        members:
          type: array
          description: 今日快照全部封板成员，按核心度降序；没有有效关系时核心度为0。
          items: { $ref: "#/components/schemas/LimitUpTodayMember" }
        cores:
          type: array
          description: 至少有一条有效关系的核心成员，最多top只。
          items: { $ref: "#/components/schemas/LimitUpTodayCore" }
        candidates:
          type: array
          description: 与今日封板成员历史共现或共享同花顺历史题材主线、但今日未封板的待选股，按综合分降序。
          items: { $ref: "#/components/schemas/LimitUpTodayCandidate" }
        candidate_limit: { type: integer, description: 每条实时主线独立保留的候选数量上限。 }
        mainline_themes:
          type: array
          description: 兼容字段，当前为空；今日主线改用 theme_mainline。
          items: { $ref: "#/components/schemas/LimitUpMainlineTheme" }
        theme_mainline:
          type: array
          description: 由同花顺 Top20 历史累计标签实时计算出的多条题材主线；至少 2 只当前封板成员共享同一标签，按成员核心度、标签 IDF、标签近期度、时效和封板质量加权。时效按该主线当前封板成员最近一次封板（回封也算）距快照的交易分钟衰减，n 只统计当前仍封板且共享该题材的成员；封板质量按当前炸板/跌停成员扣减。不解析今日实时 reason，未分类/其他/无明确原因的题材桶不参与。
          items: { $ref: "#/components/schemas/LimitUpThemeCluster" }
        mainline_candidates:
          type: array
          description: 每条实时主线各自独立排名的候选组。主线之间不合并为单一主线，同一候选可出现在多个组中。
          items: { $ref: "#/components/schemas/LimitUpTodayMainlineGroup" }
        mainline_intersections:
          type: array
          description: 两条实时主线共享的当前封板成员；只描述交叉，不合并主线。
          items: { $ref: "#/components/schemas/LimitUpTodayMainlineIntersection" }
        live_candidate: { type: boolean, description: 本次候选列表是否取得并应用了盘中行情。false时列表仅为历史观察。 }
        live_unavailable: { type: boolean, description: 已尝试读取候选行情，但至少一只候选或整批行情不可用。 }
    LimitUpThemeTag:
      type: object
      required: [code, name, occurrences, recent_occurrences, first_date, last_date]
      properties:
        code: { type: string }
        name: { type: string }
        occurrences: { type: integer, description: 窗口内该股进入该同花顺题材的天数。 }
        recent_occurrences: { type: integer, description: 最近60个自然日内该股进入该题材的天数。 }
        first_date: { type: string, format: date }
        last_date: { type: string, format: date }
    LimitUpThemeStockProfile:
      type: object
      required: [code, name, market_type, label_days, tags]
      properties:
        code: { type: string }
        name: { type: string }
        market_type: { type: string }
        label_days: { type: integer, description: 该股至少进入一个有效同花顺题材的交易日数。 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/LimitUpThemeTag" }
    LimitUpThemeCluster:
      type: object
      required: [code, name, member_count, weight, recency, freshness, seal_quality, last_seal_at, broken_count, down_count, member_codes]
      properties:
        code: { type: string }
        name: { type: string }
        member_count: { type: integer, description: 共享该题材的今日封板成员数。 }
        weight: { type: number, description: 按核心度、IDF、标签近期度、时效和封板质量衰减后的归一化主线权重。 }
        recency: { type: number, description: 0到1的标签近期度；由该标签在历史Top20中的最近出现日期计算，仅在主线内部降低陈旧标签权重。 }
        freshness: { type: number, description: 0到1的时效；e^(-Δt/90)+(1-e^(-Δt/90))×n/(n+5)，Δt 为当前封板成员最近一次封板距快照的交易分钟数，n 为当前仍封板且共享该题材的成员数，午休不计入，回封会刷新。 }
        seal_quality: { type: number, description: 0到1的封板质量；封板/(封板+0.5×炸板+1×跌停)，炸板和跌停均来自当前实时侧池。 }
        last_seal_at: { type: [string, "null"], format: date-time, description: 该主线当前封板成员最近一次封板时间；无时间数据为null。 }
        broken_count: { type: integer, description: 该主线当前炸板成员数；按去重后的股票代码计。 }
        down_count: { type: integer, description: 该主线当前跌停成员数；按去重后的股票代码计，且不会与炸板重复计数。 }
        member_codes:
          type: array
          description: 共享该题材的当前封板成员代码，用于计算主线交叉。
          items: { type: string, pattern: '^[0-9]{6}$' }
    LimitUpTodayMainlineGroup:
      type: object
      required: [theme, candidates]
      properties:
        theme: { $ref: "#/components/schemas/LimitUpThemeCluster" }
        candidates:
          type: array
          description: 只按该主线内部公式独立排序的候选，最多 candidate_limit 只。
          items: { $ref: "#/components/schemas/LimitUpTodayCandidate" }
    LimitUpTodayMainlineIntersection:
      type: object
      required: [left_code, left_name, right_code, right_name, shared_member_count, shared_member_codes, jaccard]
      properties:
        left_code: { type: string }
        left_name: { type: string }
        right_code: { type: string }
        right_name: { type: string }
        shared_member_count: { type: integer }
        shared_member_codes:
          type: array
          items: { type: string, pattern: '^[0-9]{6}$' }
        jaccard: { type: number, description: 两个主线当前封板成员集合的 Jaccard。 }
    LimitUpThemeLink:
      type: object
      required: [code, name, shared_themes, theme_days, theme_jaccard, theme_similarity, theme_purity, label_coverage, co_seal_days, last_shared_date, shared_dates]
      properties:
        code: { type: string }
        name: { type: string }
        shared_themes:
          type: array
          items: { $ref: "#/components/schemas/LimitUpThemeTag" }
        theme_days: { type: integer, description: 两只股票同日进入至少一个相同题材的天数。 }
        theme_jaccard: { type: number, description: 同题材日期集合的 Jaccard。 }
        theme_similarity: { type: number, description: 按 IDF 加权后的题材向量余弦相似度。 }
        theme_purity: { type: number, description: 同题材共现天数 / 同日收盘封板共现天数，最高1。 }
        label_coverage: { type: number, description: 同题材天数 / 对方有题材标签的交易日数。 }
        co_seal_days: { type: integer, description: 同日收盘封板次数，用于对照全市场共振。 }
        last_shared_date: { type: string, format: date }
        shared_dates:
          type: array
          items: { type: string, format: date }
    LimitUpThemeAnalysis:
      type: object
      required: [profile, links, total_links, label_days]
      properties:
        profile: { $ref: "#/components/schemas/LimitUpThemeStockProfile" }
        links:
          type: array
          items: { $ref: "#/components/schemas/LimitUpThemeLink" }
        total_links: { type: integer }
        label_days: { type: integer }
    LimitUpThemeRef:
      type: object
      required: [code, name, type, weight]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [industry, concept] }
        weight: { type: number, description: 该主线板块的归一化权重。 }
    LimitUpMainlineTheme:
      type: object
      required: [code, name, type, weight, member_count]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [industry, concept] }
        weight: { type: number }
        member_count: { type: integer }
    LimitUpCandidateLink:
      type: object
      required: [core_code, core_name, overlap_days, heat_adjusted_overlap, phi, last_shared_date]
      properties:
        core_code: { type: string }
        core_name: { type: string }
        overlap_days: { type: integer }
        heat_adjusted_overlap: { type: number }
        phi: { type: number, description: φ 相关系数，已扣除候选股与该成员各自的封板频率；0 表示无关联，越高表示越专门跟随该核心。 }
        last_shared_date: { type: string, format: date }
    LimitUpTodayCandidate:
      type: object
      required: [code, name, market_type, score, mainline_score, mainline_fit, mainline_rank, mainline_codes, cross_mainline_count, live_score, history_score, risk_score, strength, coverage, effective_links, seal_days, touch_days, last_seal_date, last_shared_date, strongest_core_code, strongest_core_name, strongest_overlap_days, strongest_heat, strongest_phi, theme_score, themes, theme_tags, top_links, live_available, limit_ratio, touched_limit, risk_flags]
      properties:
        code: { type: string }
        name: { type: string }
        market_type: { type: string }
        score: { type: number, description: 0到100的候选分。主线组内使用该组的 mainline_fit；全局候选使用跨主线共振 mainline_score。有实时行情时=100×(30%实时确认+40%主线项+20%历史特异性+10%关联覆盖)，再乘最多15%的风险折价；无实时行情时实时项退出，其余三项重新归一化。 }
        mainline_score: { type: number, description: 0到1的多主线共振分，公式为 1 - ∏(1 - 单主线贴合)。同时命中多条主线时按独立证据叠加，收益递减，不再使用最强80%+次强20%。 }
        mainline_fit: { type: number, description: 0到1的单主线贴合分：主线权重 × (o+r)/(o+r+2)，其中o为历史出现次数、r为近60日出现次数。主线组内候选按该值计算。 }
        mainline_rank: { type: integer, description: 该候选在当前主线组内的排名；全局候选为0。 }
        mainline_codes:
          type: array
          description: 该候选命中的全部实时主线代码，按贴合度降序。
          items: { type: string }
        cross_mainline_count: { type: integer, description: 命中的实时主线数量；大于1表示该候选跨主线。 }
        live_score: { type: number, description: 0到1的盘中确认分，由距涨停进度、换手、量比、主力净占比和是否触板组成；行情不可用时为0。 }
        history_score: { type: number, description: 0到1的历史特异性分，来自按候选与今日核心φ相关系数、共现置信度和核心度加权的强度，并在本批候选中归一化；仅题材候选为0。 }
        risk_score: { type: number, description: 0到1的执行风险分，1表示未命中风险规则；最终只作为最多15%的折价，不直接作为正分。 }
        strength: { type: number, description: 主线关联度：与最强 3 个今日成员的核心度加权 φ 均值，并按共现次数收缩稀疏样本；已扣除候选股自身封板频率。 }
        coverage: { type: number, description: 关联到的今日封板成员数除以今日封板总数。 }
        effective_links: { type: integer }
        seal_days: { type: integer }
        touch_days: { type: integer }
        last_seal_date: { type: string, format: date }
        last_shared_date: { type: string, format: date, description: 与今日封板成员最后一次同日收盘封板的日期。 }
        strongest_core_code: { type: string }
        strongest_core_name: { type: string }
        strongest_overlap_days: { type: integer }
        strongest_heat: { type: number }
        strongest_phi: { type: number }
        theme_score: { type: number, description: 兼容字段，与 mainline_score 相同。 }
        themes:
          type: array
          description: 兼容字段；当前为空，题材标签见 theme_tags。
          items: { $ref: "#/components/schemas/LimitUpThemeRef" }
        theme_tags:
          type: array
          description: 命中的同花顺历史题材主线标签，按共现次数/最近日期排序，最多 5 个。
          items: { $ref: "#/components/schemas/LimitUpThemeTag" }
        top_links:
          type: array
          items: { $ref: "#/components/schemas/LimitUpCandidateLink" }
        live_available: { type: boolean, description: 是否取得该候选的盘中行情。false时不能把历史分当作盘中确认。 }
        change_percent: { type: [number, "null"], description: 盘中涨跌幅，单位为百分点，7.5代表7.5%。 }
        turnover_rate: { type: [number, "null"], description: 盘中换手率，单位为百分点，3.2代表3.2%。 }
        volume_ratio: { type: [number, "null"], description: 盘中量比；上游未返回时省略。 }
        main_net_inflow: { type: [number, "null"], description: 主力净流入金额，单位元；负值表示净流出。 }
        main_net_inflow_pct: { type: [number, "null"], description: 主力净占比，单位为百分点，-7.15代表-7.15%。 }
        turnover_amount: { type: [number, "null"], description: 盘中成交额，单位元；低于2000万会触发低流动性风险提示。 }
        distance_to_limit: { type: [number, "null"], description: 距涨停空间，单位为百分点；创业板/科创板按20%、主板普通与主板ST按10%。 }
        limit_ratio: { type: number, description: 该股票适用的涨停幅度，单位为百分点：主板普通与主板ST 10、创业板/科创板20、北交所30。 }
        touched_limit: { type: boolean, description: 盘中最高价是否触及按前收计算的涨停价。 }
        risk_flags:
          type: array
          description: 盘中行情缺失、ST、上市不足60日、低换手、量比不足等风险提示；存在提示不代表自动排除。
          items: { type: string }
    BoardQuoteMeta:
