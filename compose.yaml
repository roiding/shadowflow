services:
  shadowflow:
    # Pin a specific build with SHADOWFLOW_IMAGE_TAG (CI publishes sha-<commit>
    # tags alongside latest) so a bad release can be rolled back precisely.
    image: ghcr.io/roiding/shadowflow:${SHADOWFLOW_IMAGE_TAG:-latest}
    container_name: shadowflow
    restart: unless-stopped
    ports:
      # Bind to the host loopback only: the API runs without SHADOWFLOW_API_TOKEN,
      # so publishing on 0.0.0.0 would expose all data (and /metrics) to the
      # network and bypass host firewalls via Docker's iptables rules. Front any
      # external access with a reverse proxy + TLS, or set SHADOWFLOW_API_TOKEN
      # here and widen the binding deliberately.
      - "127.0.0.1:8081:8080"
    volumes:
      - /mnt/data/shadowflow/data:/data
      - /mnt/data/shadowflow/backups:/backups
    environment:
      # Count completed compressed database backups, not calendar days.
      SHADOWFLOW_BACKUP_RETENTION_DAYS: ${SHADOWFLOW_BACKUP_RETENTION_DAYS:-3}
      # Enable only after upgrading/verifying the cold schema. Both API reads
      # and backup/restore scripts use the same explicit path.
      SHADOWFLOW_COLD_DATABASE_PATH: ${SHADOWFLOW_COLD_DATABASE_PATH:-}
      SHADOWFLOW_HOT_TRADING_DAYS: ${SHADOWFLOW_HOT_TRADING_DAYS:-10}
      SHADOWFLOW_LIMIT_UP_ARCHIVE_ENABLED: ${SHADOWFLOW_LIMIT_UP_ARCHIVE_ENABLED:-true}
      SHADOWFLOW_LIMIT_UP_SCOPE: ${SHADOWFLOW_LIMIT_UP_SCOPE:-HS,GEM2STAR}
      # The THS account lane: headless Chromium performs the risk handshake and
      # the login session persists in the database (no session file needed).
      # Credentials come from compose environment variables; they are visible
      # via `docker inspect`, which the deployment accepts as its trade-off.
      SHADOWFLOW_THS_AUTO_LOGIN: ${SHADOWFLOW_THS_AUTO_LOGIN:-true}
      SHADOWFLOW_THS_USERNAME: ${SHADOWFLOW_THS_USERNAME:-}
      SHADOWFLOW_THS_PASSWORD: ${SHADOWFLOW_THS_PASSWORD:-}
      SHADOWFLOW_THS_CREDENTIALS_FILE: ${SHADOWFLOW_THS_CREDENTIALS_FILE:-}
      SHADOWFLOW_THS_SESSION_FILE: ${SHADOWFLOW_THS_SESSION_FILE:-}
      # Chromium inside the container runs unprivileged and with a small /dev/shm.
      SHADOWFLOW_THS_CHROME_ARGS: ${SHADOWFLOW_THS_CHROME_ARGS:---no-sandbox --disable-dev-shm-usage}
      SHADOWFLOW_PROXY_POOL_URL: ${SHADOWFLOW_PROXY_POOL_URL:-}
      SHADOWFLOW_PROXY_POOL_TOKEN: ${SHADOWFLOW_PROXY_POOL_TOKEN:-}
      SHADOWFLOW_PROXY_POOL_SOURCE_IDS: ${SHADOWFLOW_PROXY_POOL_SOURCE_IDS:-}
      SHADOWFLOW_PROXY_POOL_PREWARM_COUNT: ${SHADOWFLOW_PROXY_POOL_PREWARM_COUNT:-8}
      SHADOWFLOW_PROXY_POOL_PREWARM_TIMEOUT_SECONDS: ${SHADOWFLOW_PROXY_POOL_PREWARM_TIMEOUT_SECONDS:-120}
      SHADOWFLOW_PROXY_POOL_POLL_SECONDS: ${SHADOWFLOW_PROXY_POOL_POLL_SECONDS:-2}
      SHADOWFLOW_PROXY_POOL_ACQUIRE_TIMEOUT_SECONDS: ${SHADOWFLOW_PROXY_POOL_ACQUIRE_TIMEOUT_SECONDS:-30}
      SHADOWFLOW_PROXY_POOL_REQUEST_TIMEOUT_SECONDS: ${SHADOWFLOW_PROXY_POOL_REQUEST_TIMEOUT_SECONDS:-5}
      SHADOWFLOW_PROXY_POOL_COOLDOWN_SECONDS: ${SHADOWFLOW_PROXY_POOL_COOLDOWN_SECONDS:-300}
      SHADOWFLOW_PROXY_POOL_MAX_ATTEMPTS: ${SHADOWFLOW_PROXY_POOL_MAX_ATTEMPTS:-3}
      SHADOWFLOW_PROXY_POOL_PROTOCOLS: ${SHADOWFLOW_PROXY_POOL_PROTOCOLS:-http,socks5}
      SHADOWFLOW_UPSTREAM_MAX_CONCURRENCY: ${SHADOWFLOW_UPSTREAM_MAX_CONCURRENCY:-4}
      SHADOWFLOW_MARKET_PROVIDER_COOLDOWN_SECONDS: ${SHADOWFLOW_MARKET_PROVIDER_COOLDOWN_SECONDS:-300}
      SHADOWFLOW_REQUEST_TIMEOUT_SECONDS: ${SHADOWFLOW_REQUEST_TIMEOUT_SECONDS:-12}
    # End-of-day archives hold ~250k rows of batch state plus SQLite page
    # cache in the Go heap; 256m caused OOM headroom concerns on archive days.
    # Headless Chromium (THS risk handshake) needs another few hundred MB.
    mem_limit: 1536m
    # Give in-flight archive transactions and the WAL checkpoint a window to
    # finish on shutdown instead of being killed after Docker's 10s default.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
